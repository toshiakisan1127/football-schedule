name: CDK typecheck

on:
  pull_request:
    paths:
      - 'infra/**'
      - '!infra/lambda/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cdk-typecheck.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '!infra/lambda/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cdk-typecheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infra/package.json

      - name: Install CDK dependencies
        working-directory: infra
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Typecheck CDK
        working-directory: infra
        run: npm run typecheck
