name: Deploy site to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'public/**'
      - 'nuxt.config.ts'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: football-schedule-site-deploy
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::470529257240:role/github-actions-football-schedule-cdk-deploy
  HOSTING_STACK_NAME: FootballScheduleHostingStack

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install frontend dependencies
        run: npm install --workspaces=false --prefer-offline --no-audit --no-fund

      - name: Generate static site
        env:
          NUXT_APP_BASE_URL: /
        run: npm run generate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve production hosting resources
        id: hosting
        shell: bash
        run: |
          set -euo pipefail

          site_bucket=$(aws cloudformation describe-stacks \
            --stack-name "$HOSTING_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue | [0]" \
            --output text)
          distribution_id=$(aws cloudformation describe-stacks \
            --stack-name "$HOSTING_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue | [0]" \
            --output text)
          distribution_domain=$(aws cloudformation describe-stacks \
            --stack-name "$HOSTING_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomainName'].OutputValue | [0]" \
            --output text)

          if [ -z "$site_bucket" ] || [ "$site_bucket" = "None" ]; then
            echo 'SiteBucketName output is missing.' >&2
            exit 1
          fi
          if [ -z "$distribution_id" ] || [ "$distribution_id" = "None" ]; then
            echo 'CloudFrontDistributionId output is missing.' >&2
            exit 1
          fi

          echo "site_bucket=$site_bucket" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$distribution_id" >> "$GITHUB_OUTPUT"
          echo "distribution_domain=$distribution_domain" >> "$GITHUB_OUTPUT"

      - name: Upload site assets
        env:
          SITE_BUCKET: ${{ steps.hosting.outputs.site_bucket }}
        run: |
          aws s3 sync .output/public "s3://${SITE_BUCKET}" \
            --delete \
            --exclude 'data/fixtures.json'

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ steps.hosting.outputs.distribution_id }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*'

      - name: Write deployment summary
        env:
          DISTRIBUTION_DOMAIN: ${{ steps.hosting.outputs.distribution_domain }}
        run: |
          {
            echo '## Site deployed'
            echo
            echo "https://${DISTRIBUTION_DOMAIN}"
          } >> "$GITHUB_STEP_SUMMARY"
