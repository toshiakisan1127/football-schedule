name: Lambda tests

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/lambda-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/lambda-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/lambda/fixture-fetcher

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            infra/lambda/fixture-fetcher/requirements.txt
            infra/lambda/fixture-fetcher/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run fixture fetcher tests
        run: python -m pytest -q

      - name: Run error notifier tests
        working-directory: infra/lambda/error-notifier
        run: python -m pytest -q

      - name: Verify deploy package imports
        run: |
          package_dir="$(mktemp -d)"
          bash package.sh "$package_dir"
          (
            cd "$package_dir"
            python -c 'import handler; import validation'
          )

  infra-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infra/package.json

      - name: Install CDK dependencies
        working-directory: infra
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Typecheck CDK
        working-directory: infra
        run: npm run typecheck
