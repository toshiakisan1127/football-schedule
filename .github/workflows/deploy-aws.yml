name: Deploy AWS infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::470529257240:role/github-actions-football-schedule-cdk-deploy
  PLAN_ARTIFACT_NAME: cdk-production-plan

jobs:
  plan:
    runs-on: ubuntu-latest
    concurrency:
      group: football-schedule-cdk-plan
      cancel-in-progress: true
    outputs:
      has_changes: ${{ steps.diff.outputs.has_changes }}
      lambda_only: ${{ steps.classify.outputs.lambda_only }}

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package.json
            infra/package.json

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Synthesize exact deployment assembly
        working-directory: infra
        run: npx cdk synth FootballScheduleHostingStack FootballScheduleDataStack

      - name: Create CDK diff
        id: diff
        working-directory: infra
        shell: bash
        run: |
          set +e
          npx cdk diff \
            --app cdk.out \
            FootballScheduleHostingStack FootballScheduleDataStack \
            --method=change-set \
            --fail \
            --no-color \
            2>&1 | tee cdk-diff.txt
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$status" -eq 1 ] && grep -q 'Number of stacks with differences:' cdk-diff.txt; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "cdk diff failed with exit code $status" >&2
          exit "$status"

      - name: Classify Lambda-only change
        id: classify
        if: steps.diff.outputs.has_changes == 'true'
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          echo 'lambda_only=false' >> "$GITHUB_OUTPUT"

          if grep -Eq 'IAM Statement Changes|Security Group Changes' cdk-diff.txt; then
            exit 0
          fi

          if ! grep -q 'Number of stacks with differences: 1' cdk-diff.txt; then
            exit 0
          fi

          mapfile -t resource_lines < <(grep -E '^[[:space:]]*\[[+~-]\][[:space:]]+AWS::' cdk-diff.txt || true)
          if [ "${#resource_lines[@]}" -ne 1 ]; then
            exit 0
          fi

          if [[ "${resource_lines[0]}" =~ ^[[:space:]]*\[~\][[:space:]]+AWS::Lambda::Function[[:space:]]+FixtureFetcher[[:space:]]+FixtureFetcher[[:alnum:]]+$ ]]; then
            echo 'lambda_only=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Write diff to job summary
        working-directory: infra
        run: |
          {
            echo '## CDK diff'
            echo
            echo '```text'
            cat cdk-diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save plan metadata
        if: steps.diff.outputs.has_changes == 'true'
        working-directory: infra
        run: |
          diff_hash=$(sha256sum cdk-diff.txt | awk '{print $1}')
          {
            echo "DEPLOY_SHA=${GITHUB_SHA}"
            echo "DIFF_SHA256=${diff_hash}"
          } > plan.env

      - name: Upload immutable deployment plan
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLAN_ARTIFACT_NAME }}
          path: |
            infra/cdk.out
            infra/cdk-diff.txt
            infra/plan.env
          retention-days: 14
          if-no-files-found: error

      - name: Mark approval requirement
        if: steps.diff.outputs.has_changes == 'true' && steps.classify.outputs.lambda_only != 'true'
        run: |
          {
            echo '### Approval required'
            echo 'Review the CDK diff above, then approve the `production` deployment from this workflow run.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark Lambda-only plan for auto deploy
        if: steps.diff.outputs.has_changes == 'true' && steps.classify.outputs.lambda_only == 'true'
        run: echo 'Only FixtureFetcher Lambda changed. This plan will deploy automatically.' >> "$GITHUB_STEP_SUMMARY"

      - name: No infrastructure changes
        if: steps.diff.outputs.has_changes == 'false'
        run: echo 'No CloudFormation differences. Nothing to deploy.' >> "$GITHUB_STEP_SUMMARY"

  auto-deploy-lambda:
    needs: plan
    if: >-
      needs.plan.outputs.has_changes == 'true' &&
      needs.plan.outputs.lambda_only == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: football-schedule-cdk-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout planned commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download Lambda-only CDK plan
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.PLAN_ARTIFACT_NAME }}
          path: approved-plan

      - name: Verify planned artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_sha=$(sed -n 's/^DEPLOY_SHA=//p' approved-plan/plan.env | head -n1)
          expected_hash=$(sed -n 's/^DIFF_SHA256=//p' approved-plan/plan.env | head -n1)
          actual_hash=$(sha256sum approved-plan/cdk-diff.txt | awk '{print $1}')

          if [ "$artifact_sha" != "$GITHUB_SHA" ]; then
            echo "Deployment artifact commit mismatch: expected=$GITHUB_SHA actual=$artifact_sha" >&2
            exit 1
          fi

          if [ "$actual_hash" != "$expected_hash" ]; then
            echo "Diff artifact hash mismatch: expected=$expected_hash actual=$actual_hash" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package.json
            infra/package.json

      - name: Install CDK CLI dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy FixtureFetcher Lambda change
        working-directory: infra
        run: |
          npx cdk deploy \
            --app ../approved-plan/cdk.out \
            FootballScheduleDataStack \
            --exclusively \
            --require-approval never

  deploy:
    needs: plan
    if: >-
      needs.plan.outputs.has_changes == 'true' &&
      needs.plan.outputs.lambda_only != 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: football-schedule-cdk-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout planned commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reject stale approval
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          current_main=$(git rev-parse origin/main)
          if [ "$GITHUB_SHA" != "$current_main" ]; then
            echo "Deploy rejected: planned commit $GITHUB_SHA is no longer the current main ($current_main). A new plan is required." >&2
            exit 1
          fi

      - name: Download approved CDK plan
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.PLAN_ARTIFACT_NAME }}
          path: approved-plan

      - name: Verify approved diff artifact
        shell: bash
        run: |
          set -euo pipefail
          expected_hash=$(sed -n 's/^DIFF_SHA256=//p' approved-plan/plan.env | head -n1)
          actual_hash=$(sha256sum approved-plan/cdk-diff.txt | awk '{print $1}')
          artifact_sha=$(sed -n 's/^DEPLOY_SHA=//p' approved-plan/plan.env | head -n1)

          if [ "$artifact_sha" != "$GITHUB_SHA" ]; then
            echo "Deployment artifact commit mismatch: expected=$GITHUB_SHA actual=$artifact_sha" >&2
            exit 1
          fi

          if [ "$actual_hash" != "$expected_hash" ]; then
            echo "Diff artifact hash mismatch: expected=$expected_hash actual=$actual_hash" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package.json
            infra/package.json

      - name: Install CDK CLI dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy approved CDK assembly
        working-directory: infra
        run: |
          npx cdk deploy \
            --app ../approved-plan/cdk.out \
            FootballScheduleHostingStack FootballScheduleDataStack \
            --require-approval never
